<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Explorer</title>
  </head>

  <body>
    <header class="header">
      <div class="container">
        <h1>⚽ Football Explorer</h1>
        <p>Explore ligas, times e jogadores.</p>
      </div>
    </header>

    <main class="container">
      <section id="leagues-section">
        <h2>Ligas disponíveis</h2>

        <div id="leagues-container">
        </div>
      </section>

      <section id="teams-section">
        <button id="back-to-leagues-button">← Voltar para ligas</button>
        <h2 id="teams-title">Times</h2>

        <div id="teams-container">
        </div>
      </section>

      <section id="players-section">
        <button id="back-button">← Voltar</button>

        <h2 id="players-title">Jogadores</h2>

        <div id="players-container">
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
